version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merracota_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Merra Inventory"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: staging
      DB_USERNAME: postgres
      DB_PASSWORD: W3bD3v2026
      DB_SCHEMA: merracota
      RUN_MIGRATIONS: "true"
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: merracota_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: staging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: W3bD3v2026
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d staging"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

